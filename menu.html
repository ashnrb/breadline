<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menu — Bread Line</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@1,800;1,900&family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400;1,700&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:#120d06; color:#f0e6d2; font-family:'DM Sans',sans-serif; -webkit-font-smoothing:antialiased; }
  ::selection { background:rgba(201,122,47,0.4); color:#f0e6d2; }
  .bl-desktop-nav { display:none; } .bl-mobile-toggle { display:inline-flex; }
  @media(min-width:768px){ .bl-desktop-nav{display:flex;} .bl-mobile-toggle{display:none;} }
  img { display:block; }
  ::-webkit-scrollbar{width:6px;} ::-webkit-scrollbar-track{background:#0d0904;}
  ::-webkit-scrollbar-thumb{background:rgba(201,122,47,0.3);border-radius:3px;}
  ::-webkit-scrollbar-thumb:hover{background:rgba(201,122,47,0.5);}
  @keyframes spin { to { transform:rotate(360deg); } }
  .bl-spinner { width:32px; height:32px; border:2px solid rgba(201,122,47,0.2); border-top-color:#c97a2f; border-radius:50%; animation:spin 0.8s linear infinite; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script type="text/babel" src="bl-shared.js"></script>
<script type="text/babel">

const TAG_COLOR = { vegan:'#2d6a4f', vegetarian:'#52796f' };
const TAG_LABEL = { vegan:'VG', vegetarian:'V' };

function MenuRow({ item }) {
  const [h, setH] = useState(false);
  return (
    <div onMouseEnter={() => setH(true)} onMouseLeave={() => setH(false)}
      style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', gap:24, padding:'16px 0', borderBottom:`1px solid ${C.b08}` }}>
      <div style={{ flex:1, minWidth:0 }}>
        <div style={{ display:'flex', flexWrap:'wrap', alignItems:'center', gap:8, marginBottom:2 }}>
          <span style={{ fontFamily:sans, color: h ? C.terracotta : C.cream, fontSize:14, transition:'color .2s' }}>{item.name}</span>
          {item.tags.map(t => (
            <span key={t} style={{ fontSize:10, padding:'2px 6px', letterSpacing:'0.12em', textTransform:'uppercase', background:TAG_COLOR[t], color:C.cream, opacity:0.9 }}>{TAG_LABEL[t]}</span>
          ))}
        </div>
        {item.desc && <p style={{ fontFamily:sans, fontSize:12, color:C.clay, lineHeight:1.5 }}>{item.desc}</p>}
      </div>
      <span style={{ fontFamily:serif, color:C.terracotta, fontSize:14, fontVariantNumeric:'tabular-nums', flexShrink:0 }}>${item.price.toFixed(2)}</span>
    </div>
  );
}

function MenuPage() {
  const [active, setActive] = useState('all');
  const { menuData, loading, error, reload } = useMenuData();
  useEffect(() => { if (window.lucide?.createIcons) window.lucide.createIcons({ attrs:{ width:'100%', height:'100%' } }); });

  const tabs = menuData
    ? [{ id:'all', icon:'✦', label:'All' }, ...menuData.map(c => ({ id:c.id, icon:c.icon, label:c.label }))]
    : [{ id:'all', icon:'✦', label:'All' }];
  const visible = menuData ? (active === 'all' ? menuData : menuData.filter(c => c.id === active)) : [];

  return (
    <div>
      {/* Hero */}
      <div style={{ position:'relative', height:400, overflow:'hidden', marginTop:-73 }}>
        <img src="menu-hero.jpg" alt="Bread Line menu" style={{ width:'100%', height:'100%', objectFit:'cover', objectPosition:'center 40%' }} />
        <div style={{ position:'absolute', inset:0, background:'linear-gradient(180deg,rgba(18,13,6,0.45) 0%,rgba(18,13,6,0.55) 40%,rgba(18,13,6,0.93) 75%,rgba(18,13,6,0.98) 100%)' }} />
        <div style={{ position:'absolute', inset:0, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'flex-end', padding:'0 24px 48px', textAlign:'center' }}>
          <Eyebrow style={{ marginBottom:16, textShadow:'0 1px 8px rgba(0,0,0,0.8)' }}>356 Elizabeth Street, North Hobart</Eyebrow>
          <h1 style={{ fontFamily:serif, fontSize:'clamp(2.75rem,6vw,3.75rem)', color:C.cream, marginBottom:16, textShadow:'0 2px 16px rgba(0,0,0,0.7)' }}>Our Menu</h1>
          <p style={{ fontFamily:sans, color:C.cream, fontSize:14, lineHeight:1.6, marginBottom:28, maxWidth:480, opacity:0.8, textShadow:'0 1px 8px rgba(0,0,0,0.8)' }}>Everything baked fresh to order. Halal · Vegetarian · Vegan options available.</p>
          <UberBtn>Order on Uber Eats</UberBtn>
        </div>
      </div>

      {/* Category tabs */}
      <div style={{ position:'sticky', top:72, zIndex:40, padding:'16px 24px', overflowX:'auto', background:'rgba(18,13,6,0.97)', borderBottom:`1px solid ${C.b15}`, backdropFilter:'blur(8px)' }}>
        <div style={{ display:'flex', alignItems:'center', gap:8, minWidth:'max-content', maxWidth:1152, margin:'0 auto' }}>
          {tabs.map(cat => {
            const on = active === cat.id;
            return (
              <button key={cat.id} onClick={() => setActive(cat.id)}
                style={{ display:'flex', alignItems:'center', gap:8, padding:'10px 20px', fontFamily:sans, fontSize:12, letterSpacing:'0.08em', textTransform:'uppercase', whiteSpace:'nowrap', cursor:'pointer', transition:'all .2s',
                  background: on ? C.terracotta : 'transparent', color: on ? C.cream : C.clay, border:`1px solid ${on ? C.terracotta : 'rgba(201,122,47,0.2)'}` }}>
                <span>{cat.icon}</span>{cat.label}
              </button>
            );
          })}
        </div>
      </div>

      {/* Menu content */}
      <div style={{ maxWidth:800, margin:'0 auto', padding:'64px 24px' }}>
        {loading && (
          <div style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:20, padding:'80px 24px', color:C.clay, fontFamily:sans }}>
            <div className="bl-spinner" />
            <p style={{ fontSize:14, letterSpacing:'0.15em', textTransform:'uppercase' }}>Loading menu…</p>
          </div>
        )}
        {!loading && error && (
          <div style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:16, padding:'80px 24px', textAlign:'center', color:C.clay, fontFamily:sans }}>
            <span style={{ fontSize:32 }}>⚠️</span>
            <p style={{ fontSize:14, maxWidth:420, lineHeight:1.6 }}>{error}</p>
            <button onClick={reload} style={{ marginTop:8, padding:'10px 24px', fontFamily:sans, fontSize:12, letterSpacing:'0.2em', textTransform:'uppercase', background:'transparent', border:`1px solid ${C.terracotta}`, color:C.terracotta, cursor:'pointer', borderRadius:6 }}>Try Again</button>
          </div>
        )}
        {!loading && !error && visible.map(category => (
          <section key={category.id} style={{ marginBottom:64 }}>
            <div style={{ display:'flex', alignItems:'center', gap:16, marginBottom:32 }}>
              <span style={{ fontSize:24 }}>{category.icon}</span>
              <h2 style={{ fontFamily:serif, fontSize:'clamp(1.5rem,3vw,1.875rem)', color:C.cream }}>{category.label}</h2>
              <div style={{ flex:1, height:1, background:C.b18 }} />
            </div>
            {category.items.map(item => <MenuRow key={item.name} item={item} />)}
          </section>
        ))}
        {!loading && !error && (
          <div style={{ marginTop:32, paddingTop:32, display:'flex', flexWrap:'wrap', gap:24, borderTop:`1px solid rgba(201,122,47,0.12)`, alignItems:'center' }}>
            <div style={{ display:'flex', alignItems:'center', gap:8, fontSize:12, color:C.clay, fontFamily:sans }}>
              <span style={{ padding:'2px 6px', fontSize:10, letterSpacing:'0.12em', background:'#2d6a4f', color:C.cream }}>VG</span> Vegan
            </div>
            <div style={{ display:'flex', alignItems:'center', gap:8, fontSize:12, color:C.clay, fontFamily:sans }}>
              <span style={{ padding:'2px 6px', fontSize:10, letterSpacing:'0.12em', background:'#52796f', color:C.cream }}>V</span> Vegetarian
            </div>
            <p style={{ fontFamily:sans, fontSize:12, color:'rgba(154,133,110,0.6)', marginLeft:'auto' }}>All items are halal unless noted otherwise.</p>
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(
  <PageShell alwaysScrolled><MenuPage /></PageShell>
);
</script>
</body>
</html>
