<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bread Line — Website UI Kit</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@1,800;1,900&family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400;1,700&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #120d06; color: #f0e6d2; font-family: 'DM Sans', sans-serif; -webkit-font-smoothing: antialiased; }
  .licon svg { width: 100%; height: 100%; display: block; }
  ::selection { background: rgba(201,122,47,0.4); color: #f0e6d2; }
  .bl-desktop-nav { display: none; }
  .bl-mobile-toggle { display: inline-flex; }
  @media (min-width: 768px) {
    .bl-desktop-nav { display: flex; }
    .bl-mobile-toggle { display: none; }
  }
  img { display: block; }
  @keyframes blKenBurns {
    0%   { transform: scale(1.08) translate(0, 0); }
    100% { transform: scale(1.22) translate(-2.5%, -2%); }
  }
  .bl-hero-bg {
    animation: blKenBurns 22s ease-in-out infinite alternate;
    will-change: transform;
  }
  @keyframes blScrollCue {
    0%, 100% { transform: translateX(-50%) scaleY(1); opacity: 1; }
    50%       { transform: translateX(-50%) scaleY(0.5); opacity: 0.4; }
  }
  .bl-scroll-cue { animation: blScrollCue 2.2s ease-in-out infinite; transform-origin: top; }
  @media (prefers-reduced-motion: reduce) {
    .bl-hero-bg, .bl-scroll-cue { animation: none; }
  }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: #0d0904; }
  ::-webkit-scrollbar-thumb { background: rgba(201,122,47,0.3); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(201,122,47,0.5); }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

// ─── Brand tokens ─────────────────────────────────────────────────────────────
const C = {
  base: '#120d06', deep: '#0d0904', raised: '#1c1509', secondary: '#2a1a0a',
  terracotta: '#c97a2f', amber: '#e8a84b', cream: '#f0e6d2', clay: '#9a856e',
  uber: '#06C167', open: '#2ea043',
  b08: 'rgba(201,122,47,0.08)', b15: 'rgba(201,122,47,0.15)',
  b18: 'rgba(201,122,47,0.18)', b30: 'rgba(201,122,47,0.30)',
  cream65: 'rgba(240,230,210,0.65)', cream90: 'rgba(240,230,210,0.90)',
  cream60: 'rgba(240,230,210,0.6)', cream25: 'rgba(240,230,210,0.25)',
};
const serif = "'Playfair Display', serif";
const sans  = "'DM Sans', sans-serif";

const UBER_EATS_URL = 'https://www.ubereats.com/au/store/bread-line/UTw7YZimWVaaQeMfEu6oHw?diningMode=DELIVERY';

// ─── Lucide icon wrapper ──────────────────────────────────────────────────────
function Icon({ name, size = 16, color = 'currentColor', fill = 'none', style = {} }) {
  const ref = useRef(null);
  useEffect(() => {
    if (!ref.current || ref.current.querySelector('svg')) return;
    if (window.lucide?.createIcons) {
      window.lucide.createIcons({ attrs: { width: size, height: size }, nameAttr: 'data-lucide' });
    }
  });
  return (
    <span
      ref={ref}
      data-lucide={name}
      data-fill={fill}
      style={{ display: 'inline-flex', width: size, height: size, color, flexShrink: 0, ...style }}
    />
  );
}

// ─── Primitives ───────────────────────────────────────────────────────────────
function Eyebrow({ children, track = '0.4em', style = {} }) {
  return (
    <p style={{ fontFamily: sans, fontSize: 12, textTransform: 'uppercase', letterSpacing: track, color: C.terracotta, ...style }}>
      {children}
    </p>
  );
}

function PrimaryBtn({ children, onClick, style = {} }) {
  const [h, setH] = useState(false);
  return (
    <button
      onClick={onClick}
      onMouseEnter={() => setH(true)} onMouseLeave={() => setH(false)}
      style={{
        display: 'inline-flex', alignItems: 'center', justifyContent: 'center', gap: 8,
        background: h ? C.amber : C.terracotta, color: C.cream, border: 'none', cursor: 'pointer',
        padding: '15px 34px', fontFamily: sans, fontSize: 12, fontWeight: 500, borderRadius: 8,
        textTransform: 'uppercase', letterSpacing: '0.25em', transition: 'all .25s ease',
        transform: h ? 'translateY(-1px)' : 'none',
        boxShadow: h ? '0 8px 20px -6px rgba(201,122,47,0.55)' : 'none', ...style,
      }}
    >{children}</button>
  );
}

function OutlineBtn({ children, onClick, borderColor = C.cream25, style = {} }) {
  const [h, setH] = useState(false);
  return (
    <button
      onClick={onClick}
      onMouseEnter={() => setH(true)} onMouseLeave={() => setH(false)}
      style={{
        display: 'inline-flex', alignItems: 'center', justifyContent: 'center', gap: 8,
        background: h ? C.terracotta : 'transparent', color: C.cream, cursor: 'pointer',
        border: `1px solid ${h ? C.terracotta : borderColor}`, borderRadius: 8,
        padding: '15px 34px', fontFamily: sans, fontSize: 12, fontWeight: 500,
        textTransform: 'uppercase', letterSpacing: '0.25em', transition: 'all .25s ease',
        transform: h ? 'translateY(-1px)' : 'none',
        boxShadow: h ? '0 8px 20px -6px rgba(201,122,47,0.45)' : 'none', ...style,
      }}
    >{children}</button>
  );
}

function UberBtn({ children = 'Order', small = false, size }) {
  const [h, setH] = useState(false);
  const big = size === 'lg';
  const handleClick = (e) => {
    e.preventDefault();
    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      window.location.href = UBER_EATS_URL;
    } else {
      window.open(UBER_EATS_URL, '_blank', 'noopener,noreferrer');
    }
  };
  return (
    <a
      href={UBER_EATS_URL} onClick={handleClick}
      onMouseEnter={() => setH(true)} onMouseLeave={() => setH(false)}
      style={{
        display: 'inline-flex', alignItems: 'center', justifyContent: 'center', gap: 8,
        textDecoration: 'none',
        background: big ? (h ? C.uber : 'rgba(6,193,103,0.10)') : (h ? C.uber : 'transparent'),
        color: big ? (h ? '#fff' : C.uber) : (h ? '#fff' : C.uber),
        border: `1px solid ${h ? C.uber : (big ? 'rgba(6,193,103,0.55)' : 'rgba(6,193,103,0.5)')}`,
        fontWeight: h ? 700 : (big ? 600 : 400), borderRadius: 8,
        padding: big ? '12px 26px' : (small ? '8px 16px' : '14px 32px'),
        fontFamily: sans, fontSize: big ? 11.5 : 12,
        textTransform: 'uppercase', letterSpacing: big ? '0.22em' : '0.2em',
        backdropFilter: big ? 'blur(6px)' : 'none',
        transform: h ? 'translateY(-1px) scale(1.05)' : 'scale(1)',
        boxShadow: h ? '0 9px 24px -8px rgba(6,193,103,0.5)' : 'none',
        transition: 'all .25s ease', whiteSpace: 'nowrap',
      }}
    >🛵 {children}</a>
  );
}

function TextLink({ children, onClick, style = {} }) {
  const [h, setH] = useState(false);
  return (
    <a
      href="#" onClick={(e) => { e.preventDefault(); onClick && onClick(); }}
      onMouseEnter={() => setH(true)} onMouseLeave={() => setH(false)}
      style={{
        display: 'inline-flex', alignItems: 'center', gap: 8, textDecoration: 'none',
        color: h ? C.amber : C.terracotta, fontFamily: sans, fontSize: 12,
        textTransform: 'uppercase', letterSpacing: '0.25em', paddingBottom: 4,
        borderBottom: `1px solid ${C.terracotta}`, transition: 'color .2s', ...style,
      }}
    >{children}</a>
  );
}

function Stars({ count = 5, max = 5, size = 14, color = C.terracotta }) {
  return (
    <div style={{ display: 'flex', gap: 2 }}>
      {Array.from({ length: max }).map((_, i) => (
        <Icon key={i} name="star" size={size} color={i < count ? color : 'rgba(154,133,110,0.25)'} fill={i < count ? color : 'none'} />
      ))}
    </div>
  );
}

// ─── Nav ──────────────────────────────────────────────────────────────────────
const NAV_LINKS = [
  { id: 'home',    label: 'Home' },
  { id: 'menu',    label: 'Menu' },
  { id: 'reviews', label: 'Reviews' },
  { id: 'visit',   label: 'Visit Us' },
];

function Nav({ page, go, scrolled }) {
  const [mobileOpen, setMobileOpen] = useState(false);
  useEffect(() => {
    if (window.lucide?.createIcons) {
      window.lucide.createIcons({ attrs: { width: '100%', height: '100%' } });
    }
  });
  return (
    <header style={{
      position: 'sticky', top: 0, left: 0, right: 0, zIndex: 50,
      background: scrolled ? 'rgba(18,13,6,0.97)' : 'transparent',
      backdropFilter: scrolled ? 'blur(8px)' : 'none',
      borderBottom: `1px solid ${scrolled ? C.b18 : 'transparent'}`,
      transition: 'all .5s',
    }}>
      <div style={{ maxWidth: 1152, margin: '0 auto', padding: '20px 24px', display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
        <Logo size={22} color={C.cream} mascot onClick={() => go('home')} />
        <nav className="bl-desktop-nav" style={{ alignItems: 'center', gap: 40 }}>
          {NAV_LINKS.map((l) => (
            <a key={l.id} href="#" onClick={(e) => { e.preventDefault(); go(l.id); }}
              style={{
                fontFamily: sans, fontSize: 12, textTransform: 'uppercase', letterSpacing: '0.2em',
                textDecoration: 'none', transition: 'color .2s', whiteSpace: 'nowrap',
                color: page === l.id ? C.terracotta : C.cream60,
              }}

// ─── Visit Page ───────────────────────────────────────────────────────────────
const VISIT_HOURS = [
  { day: 'Monday',    hours: 'Closed',            closed: true },
  { day: 'Tuesday',   hours: '8:00 AM – 3:00 PM' },
  { day: 'Wednesday', hours: '8:00 AM – 3:00 PM' },
  { day: 'Thursday',  hours: '8:00 AM – 3:00 PM' },
  { day: 'Friday',    hours: '8:00 AM – 3:00 PM' },
  { day: 'Saturday',  hours: '8:00 AM – 3:30 PM' },
  { day: 'Sunday',    hours: '8:30 AM – 3:00 PM' },
];

const MAPS_URL   = 'https://maps.app.goo.gl/XqxxGN3CnCmFWaFo9';
const MAPS_EMBED = 'https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2923.939049518577!2d147.31637849999998!3d-42.8741306!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0xaa6e752e6194a341%3A0x4e005d26e775b890!2sBread%20Line!5e0!3m2!1sen!2sau!4v1780283018409!5m2!1sen!2sau';

function panel(extra = {}) {
  return { padding: 32, background: C.raised, border: `1px solid ${C.b18}`, borderRadius: 16, ...extra };
}

function parseTime(str) {
  const [time, period] = str.trim().split(' ');
  const [h, m] = time.split(':').map(Number);
  let hours = h;
  if (period === 'PM' && h !== 12) hours += 12;
  if (period === 'AM' && h === 12) hours = 0;
  return hours * 60 + m;
}

function getLiveStatus() {
  const hobart = new Date(new Date().toLocaleString('en-AU', { timeZone: 'Australia/Hobart' }));
  const day = hobart.getDay();
  const todayIdx = day === 0 ? 6 : day - 1;
  const today = VISIT_HOURS[todayIdx];
  const nowMins = hobart.getHours() * 60 + hobart.getMinutes();

  if (today.closed) return { open: false, label: 'Closed today', todayIdx };

  const [openStr, closeStr] = today.hours.split(' – ');
  const openMins  = parseTime(openStr);
  const closeMins = parseTime(closeStr);

  if (nowMins < openMins) {
    return { open: false, label: `Opens at ${openStr}`, todayIdx };
  }
  if (nowMins >= closeMins) {
    return { open: false, label: 'Closed now', todayIdx };
  }

  const remaining = closeMins - nowMins;
  const h = Math.floor(remaining / 60);
  const m = remaining % 60;
  const countdown = h > 0 ? `${h}h ${m}m` : `${m}m`;
  return { open: true, label: `Open · closes in ${countdown}`, todayIdx };
}

function VisitPage() {
  const [status, setStatus] = useState(getLiveStatus);
  const todayIdx = status.todayIdx;

  useEffect(() => {
    const tick = () => setStatus(getLiveStatus());
    const id = setInterval(tick, 60000);
    return () => clearInterval(id);
  }, []);

        <div style={{ position: 'absolute', inset: 0, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'flex-end', padding: '0 24px 48px', textAlign: 'center' }}>

          <div style={{ display: 'inline-flex', alignItems: 'center', gap: 8, padding: '8px 16px', borderRadius: 999, fontFamily: sans, fontSize: 12, letterSpacing: '0.05em',
            border: `1px solid ${status.open ? 'rgba(46,160,67,0.4)' : 'rgba(201,122,47,0.25)'}`, background: status.open ? 'rgba(46,160,67,0.12)' : 'rgba(201,122,47,0.1)', backdropFilter: 'blur(6px)' }}>
            <span style={{ width: 6, height: 6, borderRadius: '50%', background: status.open ? C.open : C.clay }} />
            <span style={{ color: status.open ? C.open : C.clay }}>{status.label}</span>
          </div>
        </div>
      </div>

      <div style={{ maxWidth: 1024, margin: '0 auto', padding: '80px 24px' }}>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit,minmax(320px,1fr))', gap: 48 }}>
          {/* Map column */}
          <div>
            <div style={{ position: 'relative', overflow: 'hidden', aspectRatio: '4/3', background: C.raised, border: `1px solid ${C.b18}`, borderRadius: 16 }}>
              <iframe
                title="Bread Line on Google Maps"

                loading="lazy"

              />
              <a href={MAPS_URL} target="_blank" rel="noopener noreferrer"
                style={{ position: 'absolute', bottom: 16, right: 16, display: 'inline-flex', alignItems: 'center', gap: 8, color: C.cream, fontFamily: sans, fontSize: 12, letterSpacing: '0.2em', textTransform: 'uppercase', textDecoration: 'none', padding: '11px 20px', borderRadius: 999, background: 'rgba(18,13,6,0.92)', border: `1px solid ${C.terracotta}`, backdropFilter: 'blur(4px)' }}
                onMouseEnter={(e) => { e.currentTarget.style.background = C.terracotta; }}
                onMouseLeave={(e) => { e.currentTarget.style.background = 'rgba(18,13,6,0.92)'; }}>
                Open in Maps <Icon name="arrow-up-right" size={13} color={C.cream} />
              </a>
            </div>
            <div style={{ marginTop: 24, ...panel({ padding: 24 }) }}>
              <h3 style={{ fontFamily: serif, fontSize: 18, color: C.cream, marginBottom: 16 }}>Getting There</h3>
              {[
                'Located on Elizabeth Street in North Hobart, easily accessible from the CBD.',
                'Street parking available along Elizabeth Street and surrounding roads.',
                'Approximately 8 minutes by car from Hobart CBD.',
              ].map((t, i) => (
                <div key={i} style={{ display: 'flex', gap: 12, fontFamily: sans, fontSize: 14, color: C.clay, marginBottom: 12 }}>
                  <span style={{ color: C.terracotta }}>→</span><p>{t}</p>
                </div>
              ))}
            </div>
          </div>

          {/* Info column */}
          <div style={{ display: 'flex', flexDirection: 'column', gap: 32 }}>
            <div style={panel()}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 24 }}>
                <Icon name="clock" size={16} color={C.terracotta} />
                <h2 style={{ fontFamily: serif, fontSize: 20, color: C.cream }}>Opening Hours</h2>
              </div>
              {VISIT_HOURS.map((item, i) => {
                const isToday = i === todayIdx;
                return (
                  <div key={item.day} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '12px 16px', margin: isToday ? '0 -8px' : 0, borderRadius: isToday ? 10 : 0,
                    borderBottom: i < VISIT_HOURS.length - 1 && !isToday ? `1px solid ${C.b08}` : 'none',
                    background: isToday ? 'rgba(201,122,47,0.06)' : 'transparent' }}>
                    <span style={{ fontFamily: sans, fontSize: 14, color: item.closed ? 'rgba(154,133,110,0.4)' : isToday ? C.terracotta : C.clay }}>
                      {item.day}{isToday && <span style={{ color: C.terracotta, fontSize: 12 }}> · today</span>}
                    </span>
                    <span style={{ fontFamily: sans, fontSize: 14, color: item.closed ? 'rgba(154,133,110,0.4)' : isToday ? C.cream : 'rgba(240,230,210,0.7)' }}>
                      {item.hours}
                    </span>
                  </div>
                );
              })}
            </div>

            <div style={panel()}>
              <h2 style={{ fontFamily: serif, fontSize: 20, color: C.cream, marginBottom: 24 }}>Service Options</h2>
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}>
                {[['Dine In', '🪑'], ['Takeaway', '🥡'], ['Delivery', '🛵'], ['Kids Menu', '👶'], ['Vegan Options', '🌿'], ['Halal', '✦']].map(([l, e]) => (
                  <div key={l} style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '12px 16px', borderRadius: 12, fontFamily: sans, fontSize: 14, color: C.clay, border: `1px solid rgba(201,122,47,0.1)` }}>
                    <span>{e}</span>{l}
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

// ─── App shell ────────────────────────────────────────────────────────────────
function App() {
  const [page, setPage] = useState('home');
  const [scrolled, setScrolled] = useState(false);
  const scrollerRef = useRef(null);

  useEffect(() => {
    if (window.lucide?.createIcons) {
      window.lucide.createIcons({ attrs: { width: '100%', height: '100%' } });
    }
  });

  const go = (p) => {
    setPage(p);
    if (scrollerRef.current) scrollerRef.current.scrollTop = 0;
    setScrolled(false);
  };

  const onScroll = (e) => setScrolled(e.target.scrollTop > 30);

  const pages = { home: HomePage, menu: MenuPage, reviews: ReviewsPage, visit: VisitPage };
  const Page = pages[page];

  return (
    <div ref={scrollerRef} onScroll={onScroll}
      style={{ height: '100vh', overflowY: 'auto', overflowX: 'hidden', background: '#120d06' }}>
      <Nav page={page} go={go} scrolled={scrolled || page !== 'home'} />
      <main><Page go={go} /></main>
      <Footer go={go} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
