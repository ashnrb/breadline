<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bread Line — Website UI Kit</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@1,800;1,900&family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400;1,700&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #120d06; color: #f0e6d2; font-family: 'DM Sans', sans-serif; -webkit-font-smoothing: antialiased; }
  .licon svg { width: 100%; height: 100%; display: block; }
  ::selection { background: rgba(201,122,47,0.4); color: #f0e6d2; }
  /* responsive nav */
  .bl-desktop-nav { display: none; }
  .bl-mobile-toggle { display: inline-flex; }
  @media (min-width: 768px) {
    .bl-desktop-nav { display: flex; }
    .bl-mobile-toggle { display: none; }
  }
  img { display: block; }
  /* Hero motion */
  @keyframes blKenBurns {
    0%   { transform: scale(1.08) translate(0, 0); }
    100% { transform: scale(1.22) translate(-2.5%, -2%); }
  }
  .bl-hero-bg {
    animation: blKenBurns 22s ease-in-out infinite alternate;
    will-change: transform;
  }
  @keyframes blScrollCue {
    0%, 100% { transform: translateX(-50%) scaleY(1); opacity: 1; }
    50%      { transform: translateX(-50%) scaleY(0.5); opacity: 0.4; }
  }
  .bl-scroll-cue { animation: blScrollCue 2.2s ease-in-out infinite; transform-origin: top; }
  @media (prefers-reduced-motion: reduce) {
    .bl-hero-bg, .bl-scroll-cue { animation: none; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>

<script type="text/babel" src="components.jsx"></script>
<script type="text/babel" src="chrome.jsx"></script>
<script type="text/babel" src="HomePage.jsx"></script>
<script type="text/babel" src="MenuPage.jsx"></script>
<script type="text/babel" src="ReviewsPage.jsx"></script>
<script type="text/babel" src="VisitPage.jsx"></script>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

function App() {
  const [page, setPage] = useState('home');
  const [scrolled, setScrolled] = useState(false);
  const scrollerRef = useRef(null);

  // Lucide refresh on every render
  useEffect(() => {
    if (window.lucide && window.lucide.createIcons) {
      window.lucide.createIcons({ attrs: { width: '100%', height: '100%' } });
    }
  });

  const go = (p) => { setPage(p); if (scrollerRef.current) scrollerRef.current.scrollTop = 0; setScrolled(false); };

  const onScroll = (e) => setScrolled(e.target.scrollTop > 30);

  const Page = { home: window.HomePage, menu: window.MenuPage, reviews: window.ReviewsPage, visit: window.VisitPage }[page];

  return (
    <div ref={scrollerRef} onScroll={onScroll} style={{ height: '100vh', overflowY: 'auto', overflowX: 'hidden', background: '#120d06' }}>
      <Nav page={page} go={go} scrolled={scrolled || page !== 'home'} />
      <main><Page go={go} /></main>
      <Footer go={go} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
